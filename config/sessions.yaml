# Session registry for the calf play-behaviour dataset
# (https://huggingface.co/datasets/Sonam5/Calf-Play-Behavior-Dataset).
#
# Every notebook in ../notebooks reads this file. It records, per released session, the inputs and the
# parameters with which the released data were produced. Change only the `paths` block (and `layout`)
# to run the notebooks on your own copy of the data.
#
# Sessions: the 7 decoded sessions (frames, frame index, tracking) and the 2 annotation-only sessions.
# Farm codes: Tol = research and teaching dairy farm (visits Tol = April 2024, Tol2 = June 2024, Tol3 = May 2025);
#             Eem = commercial dairy farm (June 2024). All times are local camera-clock time.

paths:
  data_root: /path/to/Calf-Play-Behavior-Dataset   # input data (see `layout`)
  output_root: /path/to/output                     # every notebook writes below this folder
  model_root: /path/to/models                      # yolo12x.pt, sam2.1_hiera_large.pt
  layout: release                                  # 'release' or 'original' (see `layouts`)

# Folder layouts. `release` is the layout of the Hugging Face dataset after extracting each frame tar
# frames/<session_id>/<session_id>_video<NNN>.tar into frames/<session_id>/video<N>/ (see README).
# `original` is the layout of the cloud storage on which the pipeline ran.
layouts:
  release:
    video: "{data_root}/videos/{visit}/*/{filename}"            # resolved with glob (date sub-folder)
    frames_dir: "{data_root}/frames/{session_id}"
    event_log: "{data_root}/annotations/event_logs/{session_id}.csv"
    initial_prompts_dir: "{data_root}/tracking/{session_id}/initial_prompts"
    frame_index: "{data_root}/metadata/frame_index/{session_id}.csv.gz"
  original:
    video: "{data_root}/{visit}/Videos/{filename}"
    frames_dir: "{data_root}/{visit}/Decoded Frames/{decoded_folder}"
    event_log: "{data_root}/{visit}/{source}"                  # the Observer XT export listed under event_log.source
    initial_prompts_dir: "{data_root}/{visit}/Initial Prompts/{decoded_folder}"
    frame_index: "{output_root}/metadata/frame_index/{session_id}.csv.gz"

# Output folders (relative to paths.output_root) and the matching dataset folders.
outputs:
  frames: frames                    # 01 -> frames/<session_id>/video<k>/<NNNNNNN>.jpg   (dataset: frames/)
  ocr: ocr                          # 02 -> ocr/<session_id>/metadata.csv|parquet
  frame_index: metadata/frame_index # 03 -> metadata/frame_index/<session_id>.csv.gz    (dataset: metadata/frame_index/)
  initial_prompts: initial_prompts  # 04 -> initial_prompts/<session_id>/BoundingBoxes_*.txt
  tracking: tracking                # 05 -> tracking/<session_id>/masks/video<k>/annotations_<calf>.json (dataset: tracking/)
  observer_csv: observer_csv        # 06 -> observer_csv/<file>.csv (xlsx converted to csv)
  per_calf_states: per_calf_states  # 06 -> per_calf_states/<table>.csv   (intermediate, not published)
  labels: labels                    # 07 -> labels/<session_id>.csv       (dataset: annotations/labels/, via 08)
  release: release                  # 08 -> staging area, manifests and upload state (dataset: all folders)

# Parameters shared by all decoded sessions (01_decode_frames).
decode_defaults:
  stride: 5                    # keep every 5th decoded video frame (counter restarts for every video)
  max_frames_per_folder: 3000  # frames per sub-folder video1, video2, ...
  jpeg: "cv2.imwrite default"  # OpenCV JPEG default quality (95), no resizing

# Quality-control checks of the OCR readings (09_qc_tables). Nothing is corrected; the checks only count.
qc:
  window_slack_min: 5      # a Success reading outside the session's recording window (qc_window) +- 5 min is implausible
  neighbours: 25           # ... or one more than jump_s seconds from the median of 25 Success readings on each side
  jump_s: 60
  rerun_sample: 40         # frames per session (evenly spaced) for the OCR re-run check

# 3-class mapping of the Observer XT behaviours (06 and 07). Unlisted behaviours map to 'Not Playing'.
behavior_categories:
  Buck: Active Playing
  gallop: Active Playing
  Kick: Active Playing
  leap: Active Playing
  leap sideways: Active Playing
  Turn: Active Playing
  Jump: Active Playing
  chasing: Active Playing
  bouncing: Non Active Playing
  head-butting: Non Active Playing
  head-shake: Non Active Playing
  butting fixtures: Non Active Playing
  butting/rubbing straw: Non Active Playing
  mount: Non Active Playing
  frontal pushing: Non Active Playing
  play-bouncing: Non Active Playing
  Individuall: Not Playing
  Milk Feeding: Not Playing
  rest behavior: Not Playing
  out of view: Not Playing
  Management (someone in the stalls): Not Playing
  Management (someone in the pen): Not Playing
  (Blanks): Not Playing

# Observer XT exports that were turned into per-calf state tables (06_prepare_annotations; intermediate tables).
# `time_relative_parser` names the parser variant that was used for that export (both give identical results
# for the formats present: 'MM:SS.f' in Tol/Tol2 exports, '0 days HH:MM:SS.ffffff' in Eem/Tol3 exports).
annotation_exports:
  - table: Tol_2024-04-24
    original_file: GroundTruth_Tol_Ch01_20240424_054840_20240424_104652.csv
    visit: Tol
    release_sessions: [Tol_2024-04-24]
    time_relative_parser: tenths
    split: null
  - table: Tol2_2024-06-11
    original_file: GroundTruth_Tol2_Ch01_20240611_060936_20240611_235954.csv   # whole-day export
    visit: Tol2
    release_sessions: [Tol2_2024-06-11_AM, Tol2_2024-06-11_PM]
    time_relative_parser: tenths
    split: {column: Timestamp, at: "2024-06-11T13:20:00", before: Tol2_2024-06-11_AM, after: Tol2_2024-06-11_PM}
  - table: Eem_2024-06-18
    original_file: GroundTruth_Eem_Ch04_20240618_125115_20240618_230610.csv
    visit: Eem
    release_sessions: [Eem_2024-06-18]
    time_relative_parser: timedelta
    split: null
  - table: Eem_2024-06-19
    original_file: GroundTruth_Eem_Ch04_20240619_060343_20240619_235951.csv
    visit: Eem
    release_sessions: [Eem_2024-06-19]
    time_relative_parser: timedelta
    split: null

